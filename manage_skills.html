<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Skills</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-blue: #1a3a52;
            --accent-blue: #2563eb;
        }
        
        body {
            background: #f8fafc;
        }
        
        .sidebar {
            background: linear-gradient(135deg, var(--primary-blue) 0%, #0f3a66 100%);
            min-height: 100vh;
            padding: 20px;
            color: white;
        }
        
        .sidebar h3 {
            color: #3b82f6;
            margin-bottom: 30px;
            font-weight: 700;
        }
        
        .sidebar .nav-link {
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 10px;
            border-radius: 8px;
        }
        
        .sidebar .nav-link.active {
            background: rgba(255, 255, 255, 0.2);
        }
        
        .main-content {
            padding: 30px;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-3 col-lg-2 sidebar">
                <h3><i class="fas fa-cog"></i> Admin</h3>
                <nav class="nav flex-column">
                    <a class="nav-link" href="/admin"><i class="fas fa-dashboard"></i> Dashboard</a>
                    <a class="nav-link active" href="/admin/skills"><i class="fas fa-code"></i> Skills</a>
                </nav>
            </div>
            
            <div class="col-md-9 col-lg-10 main-content">
                <h1 style="color: var(--primary-blue); margin-bottom: 30px;">Manage Skills</h1>
                <div class="alert alert-info">
                    <i class="fas fa-info-circle"></i> Skills management is coming soon!
                </div>
                <a href="/admin" class="btn btn-primary">Back to Dashboard</a>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
